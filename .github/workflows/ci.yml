---
name: CI

on:
  workflow_call:
  pull_request:
    branches: ['main']

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  lint-php:
    name: Lint (PHP)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install PHP CLI
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends php-cli

      - name: Syntax-check every PHP file
        run: |
          set -e
          find deploy/opnsense -name '*.php' -print0 | xargs -0 -n1 php -l

  lint-xml:
    name: Lint (XML)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      - name: Run xmllint --noout
        run: find deploy -name '*.xml' -print0 | xargs -0 xmllint --noout

  lint-yaml:
    name: Lint (YAML)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install yamllint
        run: pip install yamllint

      - name: Run yamllint
        run: yamllint -c .yamllint.yaml .github/ .yamllint.yaml

  lint-json:
    name: Lint (JSON)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate JSON files parse cleanly
        run: |
          set -e
          find . -name '*.json' -not -path './.git/*' -print0 | \
            while IFS= read -r -d '' f; do
              echo "  $f"
              jq empty "$f"
            done

  lint-md:
    name: Lint (Markdown)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@v17
        with:
          globs: |
            **/*.md
            !CHANGELOG.md

  lint-actions:
    name: Lint (GitHub Actions)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run actionlint
        uses: raven-actions/actionlint@v2
